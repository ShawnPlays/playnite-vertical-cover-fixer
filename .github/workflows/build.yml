name: Build

# Runs on every push and pull request. Pushing a tag like v1.0.0 also publishes a GitHub Release
# with the .pext attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test and build release files
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vertical-cover-fixer
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## How to install

            Download `VerticalCoverFixer_*.pext` from **Assets** below, double-click it (or drag it onto Playnite),
            click **Yes**, then restart Playnite.

            Requires Playnite 10.
